name: Weekly AI Models Refresh  # Cost: $0 — no AI API calls

on:
  # Every Monday at 8:00 AM UTC
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't write to DB)"
        required: false
        default: "false"
        type: boolean

jobs:
  refresh:
    name: Scrape & update AI models
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger refresh endpoint
        id: refresh
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            "${{ secrets.APP_URL }}/api/refresh")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Refresh endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Parse result
        run: |
          ADDED=$(echo '${{ steps.refresh.outputs.body }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('added', 0))")
          echo "## Weekly Refresh Results" >> $GITHUB_STEP_SUMMARY
          echo "- Models added: **$ADDED**" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Full response: ${{ steps.refresh.outputs.body }}" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: refresh
    if: failure()
    steps:
      - name: Create GitHub issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The weekly AI models refresh workflow failed.\n\n**Run:** ${context.runId}\n**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["bug", "automated"],
            });
